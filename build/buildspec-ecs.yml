version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - python -m pip install --requirement requirements.lock
      - python -m pip install pytest ruff
  pre_build:
    commands:
      - ruff check .
      - python -m pytest -q
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URI"
      - IMAGE_TAG="$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-12)"
      - test -n "$IMAGE_TAG"
  build:
    commands:
      - docker build --label "org.opencontainers.image.revision=$CODEBUILD_RESOLVED_SOURCE_VERSION" --tag "$ECR_REPOSITORY_URI:$IMAGE_TAG" .
      - docker tag "$ECR_REPOSITORY_URI:$IMAGE_TAG" "$ECR_REPOSITORY_URI:latest"
  post_build:
    commands:
      - docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$ECR_REPOSITORY_URI:latest"
      - printf '{"imageUri":"%s","imageTag":"%s","sourceVersion":"%s"}\n' "$ECR_REPOSITORY_URI:$IMAGE_TAG" "$IMAGE_TAG" "$CODEBUILD_RESOLVED_SOURCE_VERSION" > image-detail.json

artifacts:
  files:
    - image-detail.json
    - deploy/ecs/task-definition.json
    - deploy/ecs/service-definition.json
    - deploy/ecs/deployment-configuration.json

